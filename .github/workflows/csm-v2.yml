# CI de CSM v2 (web Next.js + PocketBase). La CI v1 (SvelteKit à la racine) reste dans ci.yml.
name: CSM v2

on:
  push:
    paths: ["web/**", "pocketbase/**", ".github/workflows/csm-v2.yml"]
  pull_request:
    paths: ["web/**", "pocketbase/**", ".github/workflows/csm-v2.yml"]

concurrency:
  group: csm-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  PB_VERSION: "0.40.4"

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  pocketbase:
    name: PocketBase (migrations, règles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer PocketBase (somme de contrôle vérifiée)
        run: |
          Z="pocketbase_${PB_VERSION}_linux_amd64.zip"
          curl -fsSL -o "$Z" "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/$Z"
          curl -fsSL "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/checksums.txt" | grep "$Z" | sha256sum -c -
          sudo unzip -q "$Z" pocketbase -d /usr/local/bin
      - name: Migrations + superuser + serveur
        working-directory: pocketbase
        run: |
          P="--dir pb_data --migrationsDir pb_migrations --hooksDir pb_hooks"
          pocketbase migrate up $P
          pocketbase superuser upsert ci@csm.invalid "Ci-${{ github.run_id }}-pocketbase" $P
          nohup pocketbase serve --http 127.0.0.1:8090 $P > pb.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 1; done
      - name: Règles d'accès (test-rules)
        working-directory: pocketbase
        env:
          PB_SUPERUSER_EMAIL: ci@csm.invalid
          PB_SUPERUSER_PASSWORD: Ci-${{ github.run_id }}-pocketbase
        run: node scripts/test-rules.mjs

  e2e:
    name: E2E Playwright (1440×900 et 390×844)
    runs-on: ubuntu-latest
    needs: [web, pocketbase]
    env:
      PB_URL: http://127.0.0.1:8090
      CSM_COOKIE_SECURE: "false"
      PB_SUPERUSER_EMAIL: ci@csm.invalid
      PB_SUPERUSER_PASSWORD: Ci-${{ github.run_id }}-e2e
      E2E_IDENTITY: e2e@csm.invalid
      E2E_PASSWORD: E2e-${{ github.run_id }}-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: PocketBase vide + agent de test
        run: |
          Z="pocketbase_${PB_VERSION}_linux_amd64.zip"
          curl -fsSL -o "$Z" "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/$Z"
          curl -fsSL "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/checksums.txt" | grep "$Z" | sha256sum -c -
          sudo unzip -q "$Z" pocketbase -d /usr/local/bin
          cd pocketbase
          P="--dir pb_data --migrationsDir pb_migrations --hooksDir pb_hooks"
          pocketbase migrate up $P
          pocketbase superuser upsert "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" $P
          nohup pocketbase serve --http 127.0.0.1:8090 $P > pb.log 2>&1 &
          for i in $(seq 1 30); do curl -sf $PB_URL/api/health && break; sleep 1; done
          T=$(curl -sf -X POST $PB_URL/api/collections/_superusers/auth-with-password -H 'content-type: application/json' \
            -d "{\"identity\":\"$PB_SUPERUSER_EMAIL\",\"password\":\"$PB_SUPERUSER_PASSWORD\"}" | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -sf -X POST $PB_URL/api/collections/users/records -H "authorization: $T" -H 'content-type: application/json' \
            -d "{\"email\":\"$E2E_IDENTITY\",\"password\":\"$E2E_PASSWORD\",\"passwordConfirm\":\"$E2E_PASSWORD\",\"name\":\"Agent E2E\",\"role\":\"user\",\"verified\":true}" > /dev/null
      - name: Build et démarrage du serveur standalone
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npm run start:standalone > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - name: Navigateur Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Tests E2E
        working-directory: web
        run: npm run e2e -- --reporter=line
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultats
          path: |
            web/test-results
            web/web.log
            pocketbase/pb.log
          retention-days: 7

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [web, pocketbase]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: csm-web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: csm-web:ci
      - name: csm-pocketbase
        uses: docker/build-push-action@v6
        with:
          context: pocketbase
          push: false
          tags: csm-pocketbase:ci
